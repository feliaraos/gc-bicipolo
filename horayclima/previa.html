<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Previa — franja inferior</title>
<style>
/* previa.html — banco de pruebas de franja-inferior.html.
 *
 * Herramienta de taller: se abre con doble clic y muestra la franja sobre un
 * fondo que imita la camara, para revisarla sin tener que montar nada en OBS.
 * NO sale al aire y no viaja al pendrive con gc/.
 *
 * Los fondos son degradados y no fotos a proposito: asi el archivo no depende
 * de ninguna imagen y se puede copiar solo.
 */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #14171f;
  color: #e8ecf3;
  font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1.5rem;
  padding: .9rem 1.2rem;
  background: #1c202b;
  border-bottom: 1px solid #2b3040;
}

h1 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: .01em;
}

.grupo { display: flex; align-items: center; gap: .5rem; }

.grupo > span {
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: #8b93a6;
}

button {
  padding: .38rem .8rem;
  border: 1px solid #3a4055;
  border-radius: 4px;
  background: #262c3a;
  color: #dfe4ee;
  font: inherit;
  font-size: .85rem;
  cursor: pointer;
}
button:hover { background: #303747; }
button.activo {
  background: #ed1f24;
  border-color: #ed1f24;
  color: #fff;
  font-weight: 600;
}

/* El escenario es 16:9 y se escala al ancho de la ventana, igual que haria la
   Browser Source de OBS. Todo lo que hay dentro se mide en rem sobre 100vw, asi
   que la grafica se ve exactamente proporcionada a cualquier tamano. */
#escenario {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
}

#fondo { position: absolute; inset: 0; }

#fondo.cancha {
  background:
    radial-gradient(ellipse at 50% 120%, #6a7f52 0%, #4d6140 45%, #2f3a29 100%),
    linear-gradient(#8fa2b8 0%, #6b7f96 32%, #3f4f3a 33%, #2f3a29 100%);
  background-blend-mode: multiply, normal;
}

/* Un fondo claro y uno a cuadros para verificar que el crema se despegue del
   video en los dos extremos: sobre cielo y sobre asfalto. */
#fondo.claro {
  background: linear-gradient(#dfe7f2 0%, #c3cede 55%, #a8b3c2 100%);
}
#fondo.cuadros {
  background-color: #7d8590;
  background-image:
    linear-gradient(45deg, #5c636d 25%, transparent 25%, transparent 75%, #5c636d 75%),
    linear-gradient(45deg, #5c636d 25%, transparent 25%, transparent 75%, #5c636d 75%);
  background-size: 5% 8.9%;
  background-position: 0 0, 2.5% 4.45%;
}

#marco {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
}

footer {
  padding: .8rem 1.2rem 1.4rem;
  color: #8b93a6;
  font-size: .82rem;
}
footer code {
  color: #c6cddb;
  background: #232836;
  padding: .1rem .35rem;
  border-radius: 3px;
}
</style>
</head>
<body>

<header>
  <h1>Franja inferior — previa</h1>

  <!-- OJO: estos indices son las posiciones de TANDAS en franja-inferior.html y no
       se pueden adivinar desde aca (el iframe es file://, o sea otro origen, y no
       hay forma de preguntarle). Si se agrega o saca una tanda alla, hay que venir
       a corregir esta lista o los botones quedan apuntando a la de al lado. Ya
       paso el 2026-09-03 al entrar la segunda lamina de colaboracion: "Transmite"
       seguia en tanda=3 y lanzaba la que ahora ocupa ese lugar. -->
  <div class="grupo" id="tandas">
    <span>Tanda</span>
    <button data-q="" class="activo">Ciclo</button>
    <button data-q="tanda=0">Sede</button>
    <button data-q="tanda=1">Apoyo</button>
    <button data-q="tanda=2">Colab. 1</button>
    <button data-q="tanda=3">Colab. 2</button>
    <button data-q="tanda=4">Transmite</button>
  </div>

  <div class="grupo" id="fondos">
    <span>Fondo</span>
    <button data-f="cancha" class="activo">Cancha</button>
    <button data-f="claro">Claro</button>
    <button data-f="cuadros">Cuadros</button>
  </div>

  <div class="grupo">
    <span>Ritmo</span>
    <button id="rapido">Rápido (3 s)</button>
  </div>
</header>

<div id="escenario">
  <div id="fondo" class="cancha"></div>
  <iframe id="marco" src="franja-inferior.html"></iframe>
</div>

<footer>
  Los tiempos reales son 10 s la sede y 7 s por cada logo.
  <strong>Rápido</strong> los baja a 3 s para recorrer el ciclo entero sin esperar.
  El archivo que sale al aire es <code>franja-inferior.html</code>; esta previa no lo
  modifica y no viaja al pendrive.
</footer>

<script>
/* Script clasico, sin modulos: esta pagina tambien se abre con file://. */
(function () {
  'use strict';

  var marco = document.getElementById('marco');
  var fondo = document.getElementById('fondo');
  var rapido = false;
  var tanda = '';

  function recargar() {
    var partes = [];
    if (tanda) partes.push(tanda);
    if (rapido) partes.push('segsede=3&porlogo=3&segmin=3');
    marco.src = 'franja-inferior.html' + (partes.length ? '?' + partes.join('&') : '');
  }

  function activar(caja, boton) {
    var todos = caja.querySelectorAll('button');
    for (var i = 0; i < todos.length; i++) todos[i].classList.remove('activo');
    boton.classList.add('activo');
  }

  document.getElementById('tandas').addEventListener('click', function (e) {
    if (e.target.tagName !== 'BUTTON') return;
    activar(this, e.target);
    tanda = e.target.getAttribute('data-q');
    recargar();
  });

  document.getElementById('fondos').addEventListener('click', function (e) {
    if (e.target.tagName !== 'BUTTON') return;
    activar(this, e.target);
    fondo.className = e.target.getAttribute('data-f');
  });

  document.getElementById('rapido').addEventListener('click', function () {
    rapido = !rapido;
    this.classList.toggle('activo', rapido);
    this.textContent = rapido ? 'Rápido (activo)' : 'Rápido (3 s)';
    recargar();
  });
})();
</script>

</body>
</html>
