/* comentarios.html — el chat en vivo de YouTube, de a un comentario.
 *
 * Companero de franja-inferior.html: un solo archivo, autocontenido, sin
 * servidor ni build. Se arrastra a OBS como Browser Source y funciona. La unica
 * dependencia de red es la API de YouTube.
 *
 * PARA QUE ES: entre partido y partido, rescatar lo que dijo la gente que esta
 * mirando. Se prende la fuente en la escena durante la pausa y se apaga cuando
 * vuelve el juego.
 *
 * LO QUE MAS IMPORTA: si no hay ningun comentario nuevo que mostrar, no se
 * muestra NADA. La pagina queda transparente y vacia, no aparece una caja
 * diciendo "sin comentarios". Esa es toda la gracia: el operador prende la
 * fuente sin tener que revisar antes si habia algo.
 *
 * POR QUE NO HAY PANEL PARA ELEGIR CUAL SALE: porque no hay servidor. En OBS,
 * el localStorage del dock esta aislado del de la Browser Source, asi que una
 * ventana de control no tiene como hablarle a la fuente que esta al aire (ese
 * fue justamente el motivo por el que el GC de foco termino con un servidor).
 * La aprobacion uno por uno vive alla; aca lo que reemplaza a la moderacion son
 * los filtros de mas abajo. El control que queda es el bueno: prender y apagar
 * la fuente en la escena.
 *
 * REGLAS HEREDADAS QUE NO SE NEGOCIAN:
 *   1. html y body con background transparent !important, o OBS pinta un
 *      rectangulo gris encima de la camara.
 *   2. Animar solo opacity y transform: las resuelve la GPU sin rehacer layout.
 *      Nada de animar width, top, filter ni box-shadow mientras el PC codifica.
 *   3. Script clasico, sin type="module": Chromium bloquea los modulos ES
 *      cargados desde file://, que es como OBS abre un archivo local.
 *   4. Nada por CDN. El icono es un SVG escrito en el archivo.
 *   5. backdrop-filter: blur() es un no-op en OBS. Los fondos van solidos.
 *   6. Nunca aparece un error en pantalla. Si la API falla, no se muestra nada
 *      y el error va a la consola (o al cartel de ?diag=1).
 */

/* Lienzo de referencia 1920 px de ancho: ahi 1rem = 16 px. Con todo en rem la
   grafica se escala sola si la Browser Source usa otra resolucion. */
html {
  font-size: calc(100vw / 120);
  background: transparent !important;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: transparent !important;
  font-family: var(--f-cuerpo);
  -webkit-font-smoothing: antialiased;
}

:root {
  /* La paleta del torneo, la misma de la franja: rojo de marca, crema de las
     cortinas, azul marino de las salpicaduras. Si se cambia alla, se cambia
     aca; van a estar en pantalla al mismo tiempo. */
  --f-rojo:       #ed1f24;
  --f-papel:      #f2eee3;
  --f-tinta:      #16203f;
  --f-tinta-2:    #5d6880;
  --f-radio:      3px;

  /* Outfit y Mulish van incrustadas arriba. NO usar system-ui: en Chrome
     resuelve a Segoe UI, pero el CEF de OBS lo resolvia a otra cosa con
     metricas distintas, y el texto se cortaba al aire aunque en el navegador se
     viera entero. */
  --f-titulo: 'Outfit', 'Segoe UI', sans-serif;
  --f-cuerpo: 'Mulish', 'Segoe UI', sans-serif;

  /* La salida es mas corta que la entrada: entrar puede darse el lujo de
     lucirse, salir tiene que quitarse del medio. Igual que en la franja. */
  --entrada:  600ms;
  --salida:   380ms;
  --curva-in: cubic-bezier(.16, 1, .30, 1);
}

/* ---------------------------------------------------------------------------
   La zona: arriba de la franja, contra el mismo borde.

   Los 4rem laterales son la safe area de TV y los comparte con la franja, para
   que las dos cajas queden alineadas por el canto.

   Los 14rem de abajo salen de medir: la franja va a 3.5rem del borde y mide
   unos 9rem de alto, o sea que su canto superior queda a 12.5rem. Se le suman
   1.5rem de respiro. Medido el 2026-09-03 sobre una captura de las dos juntas:
   con 11.5rem la tarjeta se le montaba encima. Con ?abajo= se corre si la
   franja cambia de alto o si esta grafica se usa sola.
   --------------------------------------------------------------------------- */
#zona {
  position: fixed;
  right: 4rem;
  bottom: 14rem;
  width: 42rem;
}
#zona.izq {
  right: auto;
  left: 4rem;
}

/* ---------------------------------------------------------------------------
   La tarjeta

   Entra y sale una vez por comentario. A diferencia de la franja -que entra al
   principio y ya no se mueve mas-, aca el movimiento es el punto: cada
   comentario tiene que leerse como algo que acaba de llegar.
   --------------------------------------------------------------------------- */
#tarjeta {
  display: flex;
  align-items: stretch;
  background: var(--f-papel);
  border-radius: var(--f-radio);
  box-shadow: 0 .6rem 2rem rgba(0, 0, 0, .35);
  overflow: hidden;

  /* Estado inicial y de salida. Al quitar .dentro se vuelve a esta regla, que
     lleva la transicion corta. */
  opacity: 0;
  transform: translateY(1.4rem);
  will-change: transform, opacity;
  transition: opacity var(--salida) ease,
              transform var(--salida) ease;
}
#tarjeta.dentro {
  opacity: 1;
  transform: none;
  transition: opacity   var(--entrada) var(--curva-in),
              transform var(--entrada) var(--curva-in);
}

/* Barra roja de canto, calcada de la franja: se despliega de arriba hacia
   abajo al entrar. Es lo que amarra las dos graficas como una sola familia. */
.canto {
  flex: 0 0 .55rem;
  background: var(--f-rojo);
  transform: scaleY(0);
  transform-origin: top center;
  transition: transform 550ms var(--curva-in) 120ms;
}
#tarjeta.dentro .canto {
  transform: scaleY(1);
}

.cuerpo {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: flex-start;
  gap: 1.2rem;
  padding: 1.15rem 1.8rem 1.3rem 1.5rem;
}

/* El globo hace de contrapeso del pin de la franja: mismo lugar, mismo rojo,
   misma idea de "un icono a la izquierda que dice de que se trata". */
.globo {
  flex: none;
  width: 2.6rem;
  height: 2.6rem;
  margin-top: .45rem;
  color: var(--f-rojo);
  opacity: 0;
  transform: translateY(.5rem);
  transition: opacity .4s ease, transform .5s var(--curva-in);
}
#tarjeta.dentro .globo {
  opacity: 1;
  transform: none;
  transition-delay: 200ms;
}
.globo svg {
  display: block;
  width: 100%;
  height: 100%;
}

.texto {
  flex: 1 1 auto;
  min-width: 0;
}

/* Los tres escalonados, de arriba hacia abajo. */
.rotulo,
.autor,
.comentario {
  margin: 0;
  opacity: 0;
  transform: translateY(.5rem);
  transition: opacity .4s ease, transform .45s var(--curva-in);
}
#tarjeta.dentro .rotulo     { opacity: 1; transform: none; transition-delay: 180ms; }
#tarjeta.dentro .autor      { opacity: 1; transform: none; transition-delay: 260ms; }
#tarjeta.dentro .comentario { opacity: 1; transform: none; transition-delay: 340ms; }

.rotulo {
  font-family: var(--f-titulo);
  font-weight: 800;
  font-size: .95rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--f-rojo);
}

/* Quien escribio va arriba y en chico. Al reves que el lower third del GC,
   donde la estrella es el nombre: aca la estrella es lo que dijo. */
.autor {
  margin-top: .4rem;
  font-family: var(--f-cuerpo);
  font-weight: 700;
  font-size: 1.15rem;
  line-height: 1.2;
  color: var(--f-tinta-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.comentario {
  margin-top: .2rem;
  font-family: var(--f-cuerpo);
  font-weight: 400;
  font-size: 1.85rem;
  line-height: 1.24;
  color: var(--f-tinta);
  overflow-wrap: break-word;
  /* Tope de cuatro lineas. El filtro de largo ya descarta los kilometricos,
     asi que esto es el segundo cinturon: que nunca le crezca encima a la
     camara. */
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 4;
  overflow: hidden;
}
</style>
</head>
<body>

<div id="zona">
  <div id="tarjeta">
    <span class="canto"></span>
    <div class="cuerpo">

      <div class="globo">
        <!-- Globo de dialogo, inline: desde file:// no carga un SVG externo, y
             una libreria por CDN es una dependencia mas que puede fallar justo
             al aire. Mismo criterio que el pin de la franja. -->
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 3C6.9 3 2.8 6.2 2.8 10.2c0 2.3 1.4 4.4 3.5 5.7-.2.8-.7 2-1.4 2.8-.2.2 0 .6.3.5 1.7-.4 3-1.2 3.8-1.8 1 .2 2 .4 3 .4 5.1 0 9.2-3.2 9.2-7.2S17.1 3 12 3z"/>
        </svg>
      </div>

      <div class="texto">
        <p class="rotulo" id="rotulo"></p>
        <p class="autor" id="autor"></p>
        <p class="comentario" id="comentario"></p>
      </div>

    </div>
  </div>
</div>

<script>
/* Script clasico, sin type="module": Chromium bloquea los modulos ES cargados
   desde file://, que es como los abre la Browser Source de OBS. */
(function () {
  'use strict';

  /* ------------------------------------------------------------------
   * CONFIG
   *
   * Todo por query string, igual que la franja, para que el operador ajuste
   * desde el campo URL de OBS sin abrir el archivo. Los dos unicos obligatorios
   * son ?key= y ?video=; sin ellos la pagina no muestra nada nunca.
   *
   *   ?key=       clave de API de YouTube (obligatoria)
   *   ?video=     URL de la transmision, o el ID pelado (obligatorio)
   *   ?rotulo=    el rotulo chico de arriba
   *   ?hold=      segundos que cada comentario queda en pantalla
   *   ?gap=       segundos de respiro entre uno y el siguiente
   *   ?cada=      cada cuantos segundos se le pregunta a YouTube
   *   ?demora=    segundos antes del primero
   *   ?pos=izq    (por defecto va a la derecha)
   *   ?abajo=     rem desde el borde inferior
   *   ?ancho=     ancho de la tarjeta, en rem
   *   ?maxlargo=  descarta comentarios mas largos que esto
   *   ?minlargo=  descarta los mas cortos que esto
   *   ?links=1    permite comentarios con direcciones web (de fabrica NO)
   *   ?veta=      palabras vetadas, separadas por coma
   *   ?ignora=    nombres a ignorar, separados por coma
   *   ?desde=     solo comentarios de los ultimos N minutos (0 = todos)
   *   ?repetir=1  vuelve a mostrar los ya mostrados cuando se acaban
   *   ?olvidar=1  arranca sin memoria de lo ya mostrado (para ensayar)
   *   ?demo=1     comentarios inventados, sin clave ni internet
   *   ?diag=1     cartel de diagnostico en pantalla
   *
   * LA CLAVE VA EN LA URL Y NO EN EL ARCHIVO a proposito: asi este HTML se
   * puede compartir, versionar o mandar por correo sin llevar la credencial
   * adentro. Vive en el campo URL de la fuente de OBS, o sea en el scene
   * collection de esa maquina.
   *
   * OJO: la casilla "Archivo local" de OBS DESCARTA el query string. Para pasar
   * parametros hay que destildarla y pegar la URL file:///... completa en el
   * campo URL. Es exactamente lo mismo que pasa con la franja.
   * ------------------------------------------------------------------ */
  var q = new URLSearchParams(location.search);

  function texto(clave, porDefecto) {
    var v = q.get(clave);
    return v !== null && v !== '' ? v : porDefecto;
  }
  function numero(clave, porDefecto) {
    var v = parseFloat(q.get(clave));
    return isFinite(v) && v >= 0 ? v : porDefecto;
  }
  function lista(clave) {
    return texto(clave, '').split(',').map(function (s) {
      return s.trim().toLowerCase();
    }).filter(function (s) { return s !== ''; });
  }

  var CFG = {
    key:      texto('key', ''),
    video:    texto('video', ''),
    rotulo:   q.get('rotulo') !== null ? q.get('rotulo') : 'En el chat',

    hold:     numero('hold', 8),      // segundos en pantalla
    gap:      numero('gap', 1.2),     // respiro entre uno y otro
    cada:     numero('cada', 30),     // cada cuanto se consulta la API
    demora:   numero('demora', 0.4),

    pos:      texto('pos', ''),
    abajo:    numero('abajo', 14),
    ancho:    numero('ancho', 42),

    maxLargo: numero('maxlargo', 140),
    minLargo: numero('minlargo', 2),
    links:    q.get('links') === '1',
    veta:     lista('veta'),
    ignora:   lista('ignora'),
    desde:    numero('desde', 0),     // minutos; 0 = sin limite
    repetir:  q.get('repetir') === '1',
    olvidar:  q.get('olvidar') === '1'
  };

  var elZona      = document.getElementById('zona');
  var elTarjeta   = document.getElementById('tarjeta');
  var elRotulo    = document.getElementById('rotulo');
  var elAutor     = document.getElementById('autor');
  var elComentario = document.getElementById('comentario');

  if (CFG.pos === 'izq') elZona.classList.add('izq');
  elZona.style.bottom = CFG.abajo + 'rem';
  elZona.style.width = CFG.ancho + 'rem';
  elRotulo.textContent = CFG.rotulo;

  /* ---------- Diagnostico ----------
   *
   * Con ?diag=1 aparece un cartel arriba a la izquierda con lo que esta
   * pasando. Existe porque dentro de OBS no hay consola a mano: si el chat no
   * carga al aire, esta es la forma de ver el error real en un paso. NUNCA se
   * muestra sin el parametro, asi que no hay riesgo de que salga en pantalla
   * durante una transmision. */
  var elDiag = null;
  if (q.get('diag') === '1') {
    elDiag = document.createElement('div');
    elDiag.style.cssText = 'position:fixed;top:1rem;left:1rem;z-index:99;max-width:70vw;' +
      'padding:.6rem .9rem;border-radius:3px;background:#000;color:#0f0;' +
      'font:700 1rem/1.35 monospace;white-space:pre-wrap;word-break:break-word';
    document.body.appendChild(elDiag);
    elDiag.textContent = 'diag activo' +
      '\norigen: ' + location.protocol +
      '\nfetch: ' + (typeof fetch === 'function' ? 'si' : 'NO') +
      '\nclave: ' + (CFG.key ? 'puesta (' + CFG.key.length + ' caracteres)' : 'FALTA') +
      '\nvideo: ' + (CFG.video || 'FALTA');
  }
  function diagnostico(linea) {
    if (elDiag) elDiag.textContent += '\n' + linea;
    // Siempre a la consola, con o sin cartel: sirve al probar en el navegador.
    if (window.console) console.log('[comentarios] ' + linea);
  }

  /* ------------------------------------------------------------------
   * De donde sale el ID del video
   *
   * Acepta lo que sea que el operador tenga en el portapapeles: la URL larga,
   * la corta, la de /live, o el ID pelado. Son once caracteres de un alfabeto
   * conocido, asi que se reconocen sin adivinar.
   * ------------------------------------------------------------------ */
  function extraerVideoId(t) {
    t = String(t || '').trim();
    if (!t) return '';
    if (/^[A-Za-z0-9_-]{11}$/.test(t)) return t;
    var patrones = [
      /[?&]v=([A-Za-z0-9_-]{11})/,
      /youtu\.be\/([A-Za-z0-9_-]{11})/,
      /\/live\/([A-Za-z0-9_-]{11})/,
      /\/embed\/([A-Za-z0-9_-]{11})/,
      /\/shorts\/([A-Za-z0-9_-]{11})/
    ];
    for (var i = 0; i < patrones.length; i++) {
      var m = t.match(patrones[i]);
      if (m) return m[1];
    }
    return '';
  }

  var VIDEO = extraerVideoId(CFG.video);

  /* ------------------------------------------------------------------
   * Memoria de lo ya mostrado
   *
   * Guardada en localStorage y por video. Sin esto, cualquier recarga de la
   * fuente en medio de la transmision -el operador que aprieta "Actualizar", o
   * la casilla "Apagar la fuente cuando no este visible"- volveria a sacar al
   * aire todo lo que ya se habia mostrado. Con ?olvidar=1 se arranca en blanco,
   * que es lo que se quiere al ensayar.
   * ------------------------------------------------------------------ */
  var CLAVE_VISTOS = 'bicipolo:comentarios:vistos:' + VIDEO;
  var TOPE_VISTOS = 300;
  var vistos = {};

  (function cargarVistos() {
    if (CFG.olvidar) return;
    try {
      var crudo = localStorage.getItem(CLAVE_VISTOS);
      if (!crudo) return;
      JSON.parse(crudo).forEach(function (id) { vistos[id] = true; });
    } catch (_) { /* sin memoria se arranca en blanco, no es grave */ }
  })();

  function recordarVisto(id) {
    vistos[id] = true;
    try {
      var ids = Object.keys(vistos);
      if (ids.length > TOPE_VISTOS) ids = ids.slice(ids.length - TOPE_VISTOS);
      localStorage.setItem(CLAVE_VISTOS, JSON.stringify(ids));
    } catch (_) { /* localStorage lleno o bloqueado: no pasa nada */ }
  }

  /* ------------------------------------------------------------------
   * Los filtros
   *
   * Esto es lo que reemplaza a tener a alguien aprobando comentario por
   * comentario. Con diez personas mirando, todas conocidas, alcanza de sobra;
   * si alguna vez el chat crece, la version con panel del GC de foco es la que
   * corresponde.
   * ------------------------------------------------------------------ */
  var RE_LINK = /(https?:\/\/|www\.|\b[a-z0-9-]+\.(com|cl|net|org|io|tv|me|ly)\b)/i;

  function pasa(m) {
    if (vistos[m.id]) return false;

    var t = m.texto;
    if (t.length < CFG.minLargo || t.length > CFG.maxLargo) return false;
    if (!CFG.links && RE_LINK.test(t)) return false;

    var bajo = t.toLowerCase();
    for (var i = 0; i < CFG.veta.length; i++) {
      if (bajo.indexOf(CFG.veta[i]) !== -1) return false;
    }

    var autor = m.autor.toLowerCase();
    for (var j = 0; j < CFG.ignora.length; j++) {
      if (autor.indexOf(CFG.ignora[j]) !== -1) return false;
    }

    if (CFG.desde > 0 && m.cuando &&
        (Date.now() - m.cuando) > CFG.desde * 60000) return false;

    return true;
  }

  /* ------------------------------------------------------------------
   * La cola y el ciclo
   * ------------------------------------------------------------------ */
  var cola = [];
  var mostrados = [];   // solo se llena con ?repetir=1
  var mostrando = false;

  function encolar(mensajes) {
    var sumados = 0;
    mensajes.forEach(function (m) {
      if (!pasa(m)) return;
      /* Se marca como visto al ENCOLAR y no al mostrar: si no, la consulta
         siguiente -que llega mientras este mismo mensaje espera su turno- lo
         volveria a encolar y saldria dos veces seguidas. */
      recordarVisto(m.id);
      cola.push(m);
      sumados++;
    });
    if (sumados) diagnostico('encolados ' + sumados + ' (cola: ' + cola.length + ')');
  }

  function pintar(m) {
    elAutor.textContent = m.autor;
    elComentario.textContent = m.texto;   /* textContent: esto lo escribio cualquiera */
  }

  /* El ciclo corre siempre, este o no la fuente visible en OBS. Si la cola esta
     vacia no muestra nada y vuelve a mirar en un segundo: por eso, cuando el
     operador prende la fuente en la pausa, o hay algo y entra enseguida, o no
     hay nada y la pantalla queda limpia. */
  function ciclo() {
    if (!cola.length) {
      setTimeout(ciclo, 1000);
      return;
    }

    var m = cola.shift();
    if (CFG.repetir) mostrados.push(m);

    pintar(m);
    /* Reflujo forzado para que el navegador tome el estado limpio antes de la
       clase nueva; si no, la entrada no se animaria. */
    elTarjeta.classList.remove('dentro');
    void elTarjeta.offsetWidth;
    elTarjeta.classList.add('dentro');
    mostrando = true;

    setTimeout(function () {
      elTarjeta.classList.remove('dentro');
      mostrando = false;
      /* hold y gap se miden entre arranques de animacion, asi que una vuelta
         dura exactamente hold + gap, sin deriva. Mismo criterio que la franja. */
      setTimeout(ciclo, CFG.gap * 1000);
    }, CFG.hold * 1000);
  }

  /* Con ?repetir=1 los ya mostrados vuelven a la cola cuando se acaban los
     nuevos. De fabrica esta apagado: la gracia es justamente que si no hay nada
     nuevo, no se muestre nada. */
  if (CFG.repetir) {
    setInterval(function () {
      if (cola.length || mostrando || !mostrados.length) return;
      cola = mostrados;
      mostrados = [];
    }, 2000);
  }

  /* ------------------------------------------------------------------
   * YouTube
   *
   * Dos llamadas: una vez videos.list para sacar el activeLiveChatId, y de ahi
   * en adelante liveChat/messages en bucle, arrastrando el pageToken.
   *
   * Funciona desde file:// porque googleapis devuelve el Origin de vuelta en
   * access-control-allow-origin, incluso cuando ese Origin es "null", que es lo
   * que manda un archivo local. Verificado el 2026-09-03.
   * ------------------------------------------------------------------ */
  var API = 'https://www.googleapis.com/youtube/v3/';
  var chatId = '';
  var token = '';
  var ESPERAS = [5, 15, 45];   // reintentos, en segundos, ante una falla de red
  var fallidos = 0;

  function pedir(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      return r.json().then(function (j) {
        return { ok: r.ok, status: r.status, datos: j };
      }, function () {
        return { ok: false, status: r.status, datos: {} };
      });
    });
  }

  /* La `reason` de la API es estable; el texto que la acompana esta en ingles y
     no le sirve a nadie. `fatal` decide si tiene sentido reintentar: una caida
     de red se reintenta sola, una clave mala no se arregla insistiendo. */
  function porQueFallo(status, datos) {
    var razon = '';
    try { razon = datos.error.errors[0].reason || ''; } catch (_) { razon = ''; }

    if (razon === 'quotaExceeded' || razon === 'dailyLimitExceeded') {
      return { texto: 'se acabo la cuota diaria de la API', fatal: true };
    }
    if (razon === 'keyInvalid' || status === 400) {
      return { texto: 'la clave de API no es valida', fatal: true };
    }
    if (razon === 'accessNotConfigured') {
      return { texto: 'el proyecto de Google no tiene habilitada la YouTube Data API v3', fatal: true };
    }
    if (razon === 'ipRefererBlocked') {
      return { texto: 'la clave tiene restricciones que bloquean a este equipo', fatal: true };
    }
    if (razon === 'liveChatEnded') {
      return { texto: 'el chat de esa transmision ya cerro', fatal: true };
    }
    if (razon === 'liveChatNotFound' || razon === 'liveChatDisabled') {
      return { texto: 'esa transmision no tiene chat en vivo', fatal: true };
    }
    if (status === 403) return { texto: 'YouTube rechazo la consulta (403)', fatal: true };
    if (status === 404) return { texto: 'no se encontro ese video', fatal: true };
    return { texto: 'error ' + status, fatal: status >= 400 && status < 500 };
  }

  /* Del chat interesa poco: las altas de miembro, los avisos del sistema y los
     mensajes vacios no son un comentario que nadie quiera ver en pantalla. */
  function normalizar(item) {
    var s = item.snippet || {};
    var a = item.authorDetails || {};
    var tipo = s.type || '';
    if (tipo !== 'textMessageEvent' && tipo !== 'superChatEvent') return null;

    var t = String(s.displayMessage || '').trim();
    if (!t) return null;

    return {
      id: item.id,
      autor: a.displayName || '',
      texto: t,
      cuando: Date.parse(s.publishedAt) || 0
    };
  }

  function sondear() {
    var url = API + 'liveChat/messages?part=snippet,authorDetails&maxResults=200' +
              '&liveChatId=' + encodeURIComponent(chatId) +
              '&key=' + encodeURIComponent(CFG.key) +
              (token ? '&pageToken=' + encodeURIComponent(token) : '');

    pedir(url).then(function (r) {
      if (!r.ok) {
        var f = porQueFallo(r.status, r.datos);
        diagnostico('chat: ' + f.texto);
        if (f.fatal) return;                       // se deja de insistir
        if (fallidos < ESPERAS.length) {
          setTimeout(sondear, ESPERAS[fallidos] * 1000);
          fallidos++;
        } else {
          setTimeout(sondear, CFG.cada * 1000);
        }
        return;
      }

      fallidos = 0;
      if (r.datos.nextPageToken) token = r.datos.nextPageToken;

      var nuevos = [];
      (r.datos.items || []).forEach(function (item) {
        var m = normalizar(item);
        if (m) nuevos.push(m);
      });
      encolar(nuevos);

      /* Se respeta el ritmo del operador, pero nunca por debajo del que pide
         YouTube: consultar mas seguido de lo que sirve solo gasta cuota. Con un
         chat chico, espaciarlo no pierde nada: cada consulta trae todo lo que se
         dijo desde la anterior. */
      var espera = Math.max(CFG.cada * 1000, r.datos.pollingIntervalMillis || 0);
      setTimeout(sondear, espera);
    }).catch(function (e) {
      // Sin red. Se reintenta y no se muestra nada; al aire no pasa nada raro.
      diagnostico('chat: sin respuesta (' + e.message + ')');
      setTimeout(sondear, (ESPERAS[Math.min(fallidos, ESPERAS.length - 1)]) * 1000);
      fallidos++;
    });
  }

  /* ------------------------------------------------------------------
   * ?demo=1 — comentarios inventados, sin clave, sin internet y sin
   * transmision.
   *
   * Es el equivalente de ?logos= en la franja: sirve para dejar montada y
   * probada la fuente en OBS antes del evento, que es cuando conviene
   * descubrir que la casilla "Archivo local" se estaba comiendo el query
   * string. Entran de a uno, espaciados, para que se vea el ciclo de verdad y
   * no los cinco de golpe.
   * ------------------------------------------------------------------ */
  function demo() {
    var guion = [
      { autor: 'Camila Rojas',   texto: 'Que bueno que lo esten transmitiendo, se ve buenisimo' },
      { autor: 'pablo_bicipolo', texto: 'Saludos desde Valparaiso! A que hora juega el equipo de Nunoa?' },
      { autor: 'M. Fernandez',   texto: 'La jugada del segundo tiempo estuvo increible' },
      { autor: 'Tomas',          texto: 'Vamos los cabros!!' },
      { autor: 'Ana Luisa P.',   texto: 'Se puede ver la tabla de posiciones en algun lado?' }
    ];
    diagnostico('modo demo: ' + guion.length + ' comentarios de prueba');
    guion.forEach(function (g, i) {
      setTimeout(function () {
        encolar([{
          id: 'demo-' + i + '-' + Date.now(),
          autor: g.autor,
          texto: g.texto,
          cuando: Date.now()
        }]);
      }, i * 4000);
    });
  }

  function arrancar() {
    if (q.get('demo') === '1') { demo(); return; }

    if (!CFG.key || !VIDEO) {
      diagnostico(!CFG.key
        ? 'falta ?key= — la pagina no va a mostrar nada'
        : 'el ?video= no tiene un ID de YouTube adentro');
      return;
    }

    pedir(API + 'videos?part=liveStreamingDetails&id=' + encodeURIComponent(VIDEO) +
          '&key=' + encodeURIComponent(CFG.key)).then(function (r) {
      if (!r.ok) { diagnostico('video: ' + porQueFallo(r.status, r.datos).texto); return; }

      var item = (r.datos.items || [])[0];
      if (!item) { diagnostico('no hay ningun video con ese ID, o es privado'); return; }

      var det = item.liveStreamingDetails || {};
      chatId = det.activeLiveChatId || '';
      if (!chatId) {
        diagnostico(det.actualEndTime
          ? 'esa transmision ya termino, su chat esta cerrado'
          : 'ese video todavia no esta en vivo, o no tiene chat');
        return;
      }

      diagnostico('chat encontrado, consultando cada ' + CFG.cada + ' s');
      sondear();
    }).catch(function (e) {
      diagnostico('video: sin respuesta (' + e.message + ')');
      setTimeout(arrancar, 10000);
    });
  }

  arrancar();
  setTimeout(ciclo, CFG.demora * 1000);
})();
</script>
