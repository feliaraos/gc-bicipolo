<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cintillo de sede — BPT1</title>
<style>
/*
 * Cintillo de sede (GC inferior) para OBS.
 *
 * Archivo autocontenido: no depende del dev server, del backend ni de internet.
 * Los tokens replican a mano la estetica del overlay `timeline` de la app
 * (bg-black/80, border-white/10, emerald-400, shadow-2xl, stack font-sans).
 *
 * Nota: `backdrop-filter: blur()` es un no-op en OBS — el video vive en otra capa
 * del compositor, no detras del documento. Por eso el fondo va como degradado
 * solido; sobre camara se lee igual que la tarjeta del timeline.
 */
:root {
    /* Paleta — equivalentes exactos de las clases Tailwind de los overlays */
    --fondo-arriba: rgb(0 0 0 / 0.74);   /* bg-black/75 */
    --fondo-abajo:  rgb(0 0 0 / 0.90);   /* bg-black/90 */
    --borde:        rgb(255 255 255 / 0.10);  /* border-white/10 */
    --divisor:      rgb(255 255 255 / 0.20);  /* border-white/20 */
    --acento:       #34d399;             /* emerald-400 */
    --pin:          #ef4444;             /* red-500 */
    --texto:        #ffffff;
    --texto-tenue:  rgb(255 255 255 / 0.60);  /* text-white/60 */
    --sombra:       0 -25px 50px -12px rgb(0 0 0 / 0.45); /* shadow-2xl, hacia arriba */

    /* Ritmo */
    --entrada:      600ms;
    --salida:       500ms;
    --curva-in:     cubic-bezier(0.16, 1, 0.30, 1);
    --curva-out:    ease-in-out;
}

/* Todo se mide en rem: a 1920 de ancho 1rem = 16px, y la barra escala entera
   con el tamano que el operador le de a la Browser Source. */
html { font-size: calc(100vw / 120); }

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;   /* obligatorio para OBS */
    overflow: hidden;
}

body {
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
}

/* ---------------------------------------------------------------- la cinta */

.cinta {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(to top, var(--fondo-abajo), var(--fondo-arriba));
    border-top: 1px solid var(--borde);
    box-shadow: var(--sombra);

    /* Estado inicial: fuera de cuadro. La clase .dentro la sube. */
    transform: translateY(105%);
    opacity: 0;
    transition:
        transform var(--salida) var(--curva-out),
        opacity   var(--salida) var(--curva-out);
    will-change: transform, opacity;
}

.cinta.dentro {
    transform: translateY(0);
    opacity: 1;
    transition:
        transform var(--entrada) var(--curva-in),
        opacity   var(--entrada) var(--curva-in);
}

/* Salida: se agrega .saliendo SIN quitar .dentro, para que el pin siga
   flotando mientras la barra baja en vez de saltar a su estado inicial. */
.cinta.dentro.saliendo {
    transform: translateY(105%);
    opacity: 0;
    transition:
        transform var(--salida) var(--curva-out),
        opacity   var(--salida) var(--curva-out);
}

/* Hairline verde que se despliega desde la izquierda */
.cinta__acento {
    display: block;
    height: 0.1875rem;          /* 3px @1920 */
    background: linear-gradient(to right, var(--acento), rgb(52 211 153 / 0.35));
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 700ms var(--curva-in) 150ms;
}
.cinta.dentro .cinta__acento { transform: scaleX(1); }
/* En la salida se repliega hacia la derecha, por donde entro */
.cinta.dentro.saliendo .cinta__acento {
    transform: scaleX(0);
    transform-origin: right center;
    transition-duration: 350ms;
    transition-delay: 0ms;
}

.cinta__cuerpo {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 1.25rem 3rem;      /* margen lateral generoso, safe area de TV */
}

/* ------------------------------------------------------------------- el pin */

.pin {
    position: relative;
    flex: none;
    width: 4rem;
    height: 4rem;
    display: flex;
    align-items: center;
    justify-content: center;

    /* Caida de entrada */
    opacity: 0;
    transform: translateY(-2.5rem) scale(0.4);
    transition: none;
}
.cinta.dentro .pin {
    opacity: 1;
    transform: translateY(0) scale(1);
    transition:
        transform 700ms cubic-bezier(0.34, 1.56, 0.64, 1) 250ms,   /* rebote al aterrizar */
        opacity   300ms ease-out 250ms;
}

.pin__icono {
    position: relative;
    z-index: 2;
    width: 2.75rem;
    height: 2.75rem;
    color: var(--pin);
    filter: drop-shadow(0 0.25rem 0.5rem rgb(0 0 0 / 0.6));
    transform-origin: 50% 100%;             /* pivota sobre la punta */
}
/* El flote arranca recien cuando el pin termino de caer */
.cinta.dentro .pin__icono {
    animation: flotar 2.4s ease-in-out 950ms infinite alternate;
}

@keyframes flotar {
    from { transform: translateY(0); }
    to   { transform: translateY(-0.1875rem); }
}

/* Dos anillos de radar en la base del pin, desfasados 1s */
.pin__onda {
    position: absolute;
    z-index: 1;
    bottom: 0.5rem;
    left: 50%;
    width: 1.75rem;
    height: 0.7rem;
    margin-left: -0.875rem;
    border: 0.125rem solid var(--pin);
    border-radius: 50%;
    opacity: 0;
}
.cinta.dentro .pin__onda      { animation: radar 2s ease-out 950ms infinite; }
.cinta.dentro .pin__onda--dos { animation-delay: 1950ms; }

@keyframes radar {
    0%   { transform: scale(0.5); opacity: 0.7; }
    100% { transform: scale(2.2); opacity: 0; }
}

/* Divisor de 1px — el mismo recurso que separa columnas en el timeline */
.divisor {
    flex: none;
    width: 1px;
    align-self: stretch;
    background: var(--divisor);
    opacity: 0;
    transition: opacity 400ms ease-out;
}
.cinta.dentro .divisor { opacity: 1; transition-delay: 300ms; }

/* ------------------------------------------------------------------ el texto */

.texto {
    min-width: 0;               /* deja que el truncado funcione */
}

.texto p {
    margin: 0;
    opacity: 0;
    transform: translateY(0.6rem);
    transition:
        opacity   450ms ease-out,
        transform 450ms var(--curva-in);
}
.cinta.dentro .titulo    { opacity: 1; transform: none; transition-delay: 260ms; }
.cinta.dentro .direccion { opacity: 1; transform: none; transition-delay: 350ms; }

/* En la salida el texto se apaga antes que la barra, asi no "arrastra" letras */
.cinta.dentro.saliendo .texto p {
    opacity: 0;
    transform: translateY(0.3rem);
    transition-duration: 250ms;
    transition-delay: 0ms;
}
.cinta.dentro.saliendo .pin {
    opacity: 0;
    transform: translateY(-0.75rem) scale(0.85);
    transition:
        transform 300ms ease-in,
        opacity   250ms ease-in;
}

.titulo {
    color: var(--texto);
    font-size: 1.75rem;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* "EN VIVO": el rotulo canonico de los overlays — bold + uppercase + tracking */
.vivo {
    color: var(--acento);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-right: 0.15em;
}

.titulo b {
    font-weight: 800;
}

.texto .direccion {
    margin-top: 0.3rem;
    color: var(--texto-tenue);
    font-size: 1.05rem;
    font-weight: 500;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
</style>
</head>
<body>

<div class="cinta" id="cinta">
    <span class="cinta__acento"></span>
    <div class="cinta__cuerpo">
        <div class="pin">
            <span class="pin__onda"></span>
            <span class="pin__onda pin__onda--dos"></span>
            <!-- map-pin solid (Heroicons), inline como en el resto de los overlays -->
            <svg class="pin__icono" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M9.69 18.933l.003.001C9.89 19.02 10 19 10 19s.11.02.308-.066l.002-.001.006-.003.018-.008a5.741 5.741 0 00.281-.14c.186-.096.446-.24.757-.433.62-.384 1.445-.966 2.274-1.765C15.302 14.988 17 12.493 17 9A7 7 0 103 9c0 3.492 1.698 5.988 3.355 7.584a13.731 13.731 0 002.273 1.765 11.842 11.842 0 00.976.544l.062.029.018.008.006.003zM10 11.25a2.25 2.25 0 100-4.5 2.25 2.25 0 000 4.5z" clip-rule="evenodd" />
            </svg>
        </div>

        <span class="divisor"></span>

        <div class="texto">
            <p class="titulo">
                <span class="vivo">EN VIVO</span><span id="lead-resto"></span>
                <b id="sede"></b>
            </p>
            <p class="direccion" id="direccion"></p>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    /* ------------------------------------------------------------------
     * CONFIG — editar aca cuando OBS carga el archivo con "Archivo local"
     * tildado (esa casilla descarta el query string).
     *
     * Si en cambio se destilda "Archivo local" y se pega la URL file:///...
     * completa en el campo URL, cualquiera de estos valores se puede
     * sobreescribir por parametro:
     *
     *   ?venue=   nombre de la sede
     *   ?address= linea inferior (direccion)
     *   ?lead=    texto de arranque; "EN VIVO" se estiliza aparte
     *   ?hold=    segundos en pantalla
     *   ?gap=     segundos oculto entre pasadas; 0 lo deja fijo para siempre
     *   ?delay=   segundos antes de la primera entrada
     * ------------------------------------------------------------------ */
    var CONFIG = {
        venue: 'Estadio Municipal Juan Antonio Ríos',
        address: 'Salomón Sack Nº 331, Independencia. Santiago de Chile.',
        lead: 'EN VIVO desde el',
        hold: 30,      // segundos en pantalla
        gap: 30,       // segundos oculto antes de volver; 0 = queda fijo
        delay: 0.4,    // segundos antes de la primera entrada
    };

    /* Duracion de las transiciones de la barra. Tienen que coincidir con
     * --entrada y --salida del CSS: el ciclo espera a que la salida termine
     * para recien ahi resetear las clases. */
    var SALIDA_MS = 500;

    var params = new URLSearchParams(window.location.search);

    function texto(clave) {
        var valor = params.get(clave);
        return valor !== null && valor !== '' ? valor : CONFIG[clave];
    }

    function numero(clave) {
        var valor = parseFloat(params.get(clave));
        return isFinite(valor) && valor >= 0 ? valor : CONFIG[clave];
    }

    var cinta = document.getElementById('cinta');

    // El lead trae "EN VIVO" adelante, que va estilizado en su propio <span>.
    // Se separa esa cabeza y el resto ("desde el") se inyecta como texto plano.
    var lead = texto('lead');
    var resto = lead.replace(/^\s*en\s+vivo\s*/i, '');
    document.getElementById('lead-resto').textContent = resto ? ' ' + resto : '';

    // textContent y no innerHTML: una direccion con & o comillas no rompe nada.
    document.getElementById('sede').textContent = texto('venue');
    document.getElementById('direccion').textContent = texto('address');

    var demora = numero('delay');
    var permanencia = numero('hold');
    var pausa = numero('gap');

    /* El ciclo corre mientras la pagina este cargada, o sea todo el tiempo que
     * la escena este al aire. `hold` y `gap` se miden entre arranques de
     * animacion, asi que una vuelta completa dura exactamente hold + gap. */

    function entrar() {
        // Sacar .saliendo y volver a poner .dentro en el mismo frame no
        // reiniciaria las animaciones del pin: el reflujo forzado obliga al
        // navegador a tomar el estado limpio antes de la clase nueva.
        cinta.classList.remove('dentro', 'saliendo');
        void cinta.offsetWidth;
        cinta.classList.add('dentro');

        if (pausa > 0 && permanencia > 0) {
            window.setTimeout(salir, permanencia * 1000);
        }
    }

    function salir() {
        // .dentro se mantiene y se suma .saliendo, asi el pin sigue vivo
        // mientras la barra baja. Las clases se limpian recien cuando la
        // barra ya esta fuera de cuadro, para que nadie vea el reseteo.
        cinta.classList.add('saliendo');
        window.setTimeout(function () {
            cinta.classList.remove('dentro', 'saliendo');
        }, SALIDA_MS);

        window.setTimeout(entrar, pausa * 1000);
    }

    // Un frame de margen para que el navegador registre el estado inicial y
    // recien despues corra la transicion (mismo truco que el popup de eventos).
    window.setTimeout(function () {
        requestAnimationFrame(entrar);
    }, demora * 1000);
})();
</script>

</body>
</html>
